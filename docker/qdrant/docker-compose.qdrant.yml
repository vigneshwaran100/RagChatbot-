# ─────────────────────────────────────────────────────────────────────────────
# docker/qdrant/docker-compose.qdrant.yml
#
# Reference compose for the standalone Qdrant vector store.
# Run this SEPARATELY if Qdrant is not already running.
#
# Usage:
#   docker compose -f docker/qdrant/docker-compose.qdrant.yml up -d
# ─────────────────────────────────────────────────────────────────────────────
version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    networks:
      - qdrant_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qdrant_data:

networks:
  qdrant_net:
    name: qdrant_net
    driver: bridge
